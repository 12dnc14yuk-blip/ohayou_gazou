<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おはよう画像メーカー v1.3</title>
<style>
:root{
  --ink:#352f44; --muted:#81798e; --line:#ece7f4; --panel:#fff;
  --violet:#8b74eb; --pink:#f47caf; --bg:#f7f4fb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif
}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:22px;margin:6px 0 3px}
.lead{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:12px;margin:10px 0;box-shadow:0 5px 20px rgba(72,55,105,.06)
}
.preview-shell{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#eee}
canvas{width:100%;height:100%;display:block;touch-action:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,.filebtn,select,input[type=range]{font:inherit}
button,.filebtn{
  width:100%;border:0;border-radius:13px;padding:12px 10px;font-weight:800;
  cursor:pointer;text-align:center
}
.primary{background:linear-gradient(135deg,#8c75ec,#bd8cf5);color:white}
.pink{background:linear-gradient(135deg,#f57ba8,#f5a36e);color:white}
.soft{background:#f2eff8;color:#554b6b}
.danger{background:#fff0f2;color:#b24b5f}
.filebtn{display:block;background:#f0ecff;color:#6651ba}
input[type=file]{display:none}
.section-title{font-weight:900;margin-bottom:8px}
.status{
  margin-top:8px;padding:9px 10px;border-radius:10px;background:#faf8ff;
  color:#665c79;font-size:12px;line-height:1.55
}
.small,.tip{font-size:12px;color:var(--muted);line-height:1.6}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink)}
label.slider{display:grid;grid-template-columns:82px 1fr 58px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
label.slider output{text-align:right;color:#6d647d;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}
.pill{display:inline-block;background:#f1edff;color:#6c58c0;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.footer{font-size:11px;color:#9891a3;text-align:center;margin-top:16px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌞 おはよう画像メーカー v1.3</h1>
  <div class="lead">
    今回は「アバターを消しすぎない」を最優先。切り抜き後の追加削除を初期OFFにして、
    元気なポップ背景・しっかりしたフレーム・文字配置テンプレを増やしました。
  </div>

  <div class="card">
    <div class="preview-shell"><canvas id="cv" width="1200" height="675"></canvas></div>
    <div id="status" class="status">① 今日の配信スクショを選んでください。</div>
  </div>

  <div class="card">
    <div class="section-title">① 今日の女の子を入れる</div>
    <label class="filebtn" for="file">📸 配信スクショを選ぶ</label>
    <input id="file" type="file" accept="image/*">

    <div class="grid2" style="margin-top:8px">
      <button id="removeBg" class="pink">✂️ 女の子だけ自動切り抜き</button>
      <button id="useOriginal" class="soft">そのまま使う</button>
    </div>

    <label class="slider">
      <span>ゴミ掃除</span>
      <input id="cleanup" type="range" min="0" max="100" value="0">
      <output id="cleano">0</output>
    </label>
    <div class="tip">
      <b>0がいちばん安全。</b> 白い服や淡い髪を残したい日は0〜15がおすすめ。
      背景の残りが気になる時だけ少し上げてください。
      <span class="pill">アバター保護優先</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">② ワンタップで作る</div>
    <button id="randomAll" class="primary">✨ 全部ランダム作成</button>

    <div class="grid3" style="margin-top:8px">
      <button id="randomMsg" class="soft">💬 文字だけ</button>
      <button id="randomBg" class="soft">🎨 背景だけ</button>
      <button id="randomFrame" class="soft">🖼 フレームだけ</button>
    </div>

    <div class="grid2" style="margin-top:8px">
      <button id="randomLayout" class="soft">🔤 文字配置だけ</button>
      <button id="randomPos" class="soft">👧 女の子配置だけ</button>
    </div>

    <div class="row" style="margin-top:8px">
      <select id="tone">
        <option value="auto">文章：おまかせ</option>
        <option value="genki">文章：元気</option>
        <option value="gentle">文章：やさしい</option>
        <option value="yurui">文章：ゆるい</option>
        <option value="ouen">文章：応援</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="section-title">③ 女の子を微調整</div>
    <div class="small">画像上でドラッグしても動かせます。</div>
    <label class="slider"><span>左右</span><input id="x" type="range" min="-500" max="500" value="-260"><output id="xo">-260</output></label>
    <label class="slider"><span>上下</span><input id="y" type="range" min="-300" max="300" value="20"><output id="yo">20</output></label>
    <label class="slider"><span>大きさ</span><input id="scale" type="range" min="40" max="220" value="140"><output id="so">140%</output></label>
    <button id="flip" class="soft">↔️ 左右反転</button>
  </div>

  <div class="card">
    <div class="section-title">④ 保存</div>
    <div class="grid2">
      <button id="save" class="primary">⬇️ PNGで保存</button>
      <button id="reset" class="danger">リセット</button>
    </div>
    <div class="small" style="margin-top:8px">1200 × 675 px（16:9）</div>
  </div>

  <div class="footer">おはよう画像メーカー v1.3</div>
</div>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;

const state={
  sourceImg:null, rawCutout:null, charImg:null,
  x:-260,y:20,scale:1.4,flip:false,
  bg:0,frame:0,layout:0,msg:'',
  drag:false,lastX:0,lastY:0
};

const palettes=[
  {bg:'#f7bfd9', hot:'#ff5eaa', cyan:'#8ee4e5', purple:'#a98bf2', yellow:'#ffd95f', cream:'#fff4df', white:'#fff', ink:'#4e3b57'},
  {bg:'#cda0e7', hot:'#ffcc00', cyan:'#bff3ff', purple:'#7f6ee9', yellow:'#ffe36a', cream:'#f8d5ff', white:'#fff', ink:'#503f64'},
  {bg:'#f8b6df', hot:'#ff6cb7', cyan:'#8ed6dd', purple:'#c5a2ff', yellow:'#ffdf78', cream:'#fff4c9', white:'#fff', ink:'#5c3b58'},
  {bg:'#ffd0dc', hot:'#ff7b9e', cyan:'#92d9de', purple:'#aa90ef', yellow:'#ffc65f', cream:'#fff7e6', white:'#fff', ink:'#5a4653'}
];

const messages={
  genki:[
    '今日もたのしくいこ〜！',
    '今日も元気にいってらっしゃい！',
    'いっぱい笑える日になりますように！',
    'いいこと見つけにいこっ！',
    '今日もハッピー見つけよ〜！',
    '元気チャージしていこ〜！'
  ],
  gentle:[
    '今日もいい日になりますように♡',
    '無理せず自分のペースでいこ〜！',
    '今日もやさしい時間がありますように',
    'ひとつずつ、ゆっくりいこ〜！',
    '肩の力をぬいていってらっしゃい！'
  ],
  yurui:[
    'ゆるっと今日もいこ〜！',
    'ぼちぼちがんばろ〜！',
    '今日もマイペースでいこっ！',
    '気楽にいこ〜！',
    '今日もほどほどにがんばろ〜！'
  ],
  ouen:[
    '今日もあなたらしくいけますように！',
    '今日も応援してるよっ！',
    '大丈夫、ひとつずついこ〜！',
    'できるところからで大丈夫！',
    'いい一日になる予感〜！'
  ]
};
let recent=[];

const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const setStatus=t=>document.getElementById('status').textContent=t;

function chooseMessage(){
  let tone=document.getElementById('tone').value;
  if(tone==='auto') tone=pick(['genki','genki','gentle','yurui','ouen']);
  let pool=messages[tone].filter(x=>!recent.includes(x));
  if(!pool.length) pool=messages[tone];
  state.msg=pick(pool);
  recent.push(state.msg);
  if(recent.length>8) recent.shift();
}

function rr(x,y,w,h,r,fill,stroke=null,line=0){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}
}
function circle(x,y,r,fill,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.restore();
}
function star(x,y,r,fill,a=1,stroke=null,line=0){
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang=-Math.PI/2+i*Math.PI/5;
    const rad=i%2===0?r:r*.44;
    const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}
  ctx.restore();
}
function heart(x,y,s,fill,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.moveTo(0,8);
  ctx.bezierCurveTo(-18,-5,-14,-22,0,-14);
  ctx.bezierCurveTo(14,-22,18,-5,0,8);
  ctx.fillStyle=fill;ctx.fill();ctx.restore();
}
function squiggle(x,y,len,amp,color,line=6,a=1,vertical=false){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=line;ctx.lineCap='round';
  ctx.beginPath();
  if(!vertical){
    ctx.moveTo(x,y);
    for(let i=0;i<=len;i+=14) ctx.lineTo(x+i,y+Math.sin(i/18)*amp);
  }else{
    ctx.moveTo(x,y);
    for(let i=0;i<=len;i+=14) ctx.lineTo(x+Math.sin(i/18)*amp,y+i);
  }
  ctx.stroke();ctx.restore();
}
function flower(x,y,s,p){
  circle(x,y,14*s,p.yellow,1);
  [[0,-34],[32,-10],[20,28],[-20,28],[-32,-10]].forEach(([dx,dy])=>circle(x+dx*s,y+dy*s,20*s,p.cream,1));
}
function tulip(x,y,s,color){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#b9dda9';ctx.fillRect(-4,8,8,64);
  ctx.beginPath();ctx.moveTo(-32,6);ctx.quadraticCurveTo(-30,-20,0,-22);ctx.quadraticCurveTo(30,-20,32,6);ctx.quadraticCurveTo(15,22,0,32);ctx.quadraticCurveTo(-15,22,-32,6);ctx.fillStyle=color;ctx.fill();
  ctx.restore();
}

function drawBackground(){
  const p=palettes[state.bg%palettes.length];
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,H);

  if(state.bg%4===0){
    for(let i=0;i<20;i++) circle(60+rand(1080),50+rand(570),8+rand(34),[p.hot,p.cyan,p.purple,p.yellow][i%4],.55);
    for(let i=0;i<14;i++) heart(70+rand(1060),60+rand(550),.45+Math.random()*.7,p.hot,.7);
    for(let i=0;i<10;i++) star(70+rand(1060),60+rand(550),10+rand(14),p.yellow,.9);
  }else if(state.bg%4===1){
    for(let i=0;i<30;i++) star(50+rand(1100),40+rand(590),10+rand(22),null,.95,p.cyan,4);
    for(let i=0;i<16;i++) star(70+rand(1060),60+rand(550),10+rand(16),p.yellow,.95);
    for(let i=0;i<10;i++) circle(80+rand(1040),70+rand(520),25+rand(45),p.white,.12);
  }else if(state.bg%4===2){
    for(let i=0;i<18;i++) circle(70+rand(1060),60+rand(550),10+rand(28),[p.hot,p.cyan,p.purple][i%3],.5);
    for(let i=0;i<6;i++) flower(100+rand(1000),100+rand(460),.8+Math.random()*.4,p);
    for(let i=0;i<10;i++) heart(80+rand(1040),80+rand(500),.5+Math.random()*.5,p.hot,.65);
  }else{
    for(let i=0;i<22;i++) circle(70+rand(1060),60+rand(550),7+rand(22),[p.hot,p.cyan,p.purple,p.yellow][i%4],.6);
    for(let i=0;i<12;i++) star(80+rand(1040),70+rand(520),8+rand(15),p.yellow,.85);
  }
}

function drawFrame(){
  const p=palettes[state.bg%palettes.length];
  const f=state.frame%4;

  if(f===0){
    rr(32,30,W-64,H-60,34,'rgba(255,255,255,.04)',p.white,10);
    rr(48,46,W-96,H-92,28,'rgba(255,255,255,.02)',p.purple,5);
    squiggle(70,78,220,10,p.purple,5,.8);
    squiggle(W-295,H-82,220,10,p.purple,5,.8);
  }else if(f===1){
    rr(28,28,W-56,H-56,36,'rgba(255,255,255,.03)',p.cyan,12);
    for(let x=78;x<W-78;x+=90) star(x,62,9,p.yellow,.9);
    for(let x=70;x<W-70;x+=90) heart(x,H-58,.5,p.hot,.8);
    squiggle(58,110,H-220,9,p.purple,5,.8,true);
    squiggle(W-58,110,H-220,9,p.purple,5,.8,true);
  }else if(f===2){
    rr(30,30,W-60,H-60,38,'rgba(255,255,255,.03)',p.white,14);
    rr(45,45,W-90,H-90,30,'rgba(255,255,255,.02)',p.hot,6);
    flower(84,92,.7,p);flower(W-86,94,.7,p);flower(88,H-92,.7,p);flower(W-90,H-90,.7,p);
  }else{
    rr(32,30,W-64,H-60,34,'rgba(255,255,255,.04)',p.yellow,8);
    for(let i=0;i<7;i++) squiggle(55+i*165,62,90,7,p.white,4,.8);
    for(let i=0;i<6;i++) tulip(140+i*170,H-58,.55,[p.hot,p.yellow,p.purple][i%3]);
  }
}

function drawCharacter(){
  if(!state.charImg)return;
  const img=state.charImg;
  const h=680*state.scale;
  const w=h*(img.naturalWidth/img.naturalHeight);
  const cx=W/2+state.x, bottom=H/2+160+state.y;

  ctx.save();
  ctx.translate(cx,bottom);
  ctx.scale(state.flip?-1:1,1);

  ctx.save();
  ctx.globalAlpha=.15;ctx.filter='blur(18px)';
  ctx.fillStyle='rgba(55,25,70,.6)';
  ctx.beginPath();ctx.ellipse(0,h*.37,w*.22,h*.045,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
}

function font(size){return `900 ${size}px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif`;}
function fitSize(text,maxWidth,start,min=30){
  for(let s=start;s>=min;s-=2){
    ctx.font=font(s);
    if(ctx.measureText(text).width<=maxWidth)return s;
  }
  return min;
}
function splitJapanese(text,maxWidth,size,maxLines=3){
  ctx.font=font(size);
  const lines=[];let line='';
  for(const ch of text){
    const t=line+ch;
    if(ctx.measureText(t).width>maxWidth && line){
      lines.push(line);line=ch;
    }else line=t;
  }
  if(line)lines.push(line);
  return lines.slice(0,maxLines);
}
function outlined(text,x,y,size,fill,stroke,stroke2=null,align='center'){
  ctx.save();
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.font=font(size);
  if(stroke2){ctx.lineWidth=size*.23;ctx.strokeStyle=stroke2;ctx.strokeText(text,x,y);}
  ctx.lineWidth=size*.14;ctx.strokeStyle=stroke;ctx.strokeText(text,x,y);
  ctx.fillStyle=fill;ctx.fillText(text,x,y);
  ctx.restore();
}

function drawText(){
  const p=palettes[state.bg%palettes.length];
  const L=state.layout%4;
  const leftChar=state.x<0;

  if(L===0){
    const zone=leftChar?{x:635,w:480}:{x:85,w:480};
    const cx=zone.x+zone.w/2;
    outlined('おはよう！',cx,190,116,p.white,p.hot,p.yellow);
    ctx.save();ctx.textAlign='center';ctx.font=font(27);ctx.fillStyle=p.purple;
    outlined('今日もたのしい1日に',cx,105,27,p.white,p.purple,p.yellow);ctx.restore();

    let s=52, lines=splitJapanese(state.msg,zone.w,s,3);
    while(lines.length>3 && s>32){s-=2;lines=splitJapanese(state.msg,zone.w,s,3);}
    const total=(lines.length-1)*s*1.02;
    lines.forEach((t,i)=>outlined(t,cx,415-total/2+i*s*1.02,s,p.white,p.hot,null));
  }
  else if(L===1){
    // giant title top, message bottom
    outlined('おはよう',W/2,112,138,p.white,p.purple,null);
    let s=72;
    const lines=splitJapanese(state.msg,900,s,2);
    const yy=H-115;
    lines.forEach((t,i)=>outlined(t,W/2,yy-(lines.length-1)*40+i*82,s,p.white,p.purple,null));
  }
  else if(L===2){
    const zone=leftChar?{x:610,w:500}:{x:80,w:500};
    const cx=zone.x+zone.w/2;
    outlined('おはよう',cx,205,126,p.white,p.cyan,null);
    let s=70;
    const lines=splitJapanese(state.msg,zone.w,s,3);
    lines.forEach((t,i)=>outlined(t,cx,380+i*76,s,p.white,p.cyan,null));
  }
  else{
    const zone=leftChar?{x:650,w:430}:{x:120,w:430};
    const cx=zone.x+zone.w/2;
    rr(zone.x,120,zone.w,400,40,'rgba(255,255,255,.18)',p.white,5);
    outlined('おはよう！',cx,225,105,p.white,p.purple,p.yellow);
    let s=48;
    const lines=splitJapanese(state.msg,zone.w-45,s,3);
    lines.forEach((t,i)=>outlined(t,cx,385+i*58,s,p.white,p.hot,null));
  }
}

function draw(){
  drawBackground();
  drawFrame();
  drawCharacter();
  drawText();
}

async function applyCleanup(img,amount){
  if(amount<=0)return img;

  const off=document.createElement('canvas');
  off.width=img.naturalWidth||img.width;
  off.height=img.naturalHeight||img.height;
  const o=off.getContext('2d');
  o.drawImage(img,0,0);
  const id=o.getImageData(0,0,off.width,off.height);
  const d=id.data;

  // gentle alpha-only cleanup. No RGB/white removal.
  const threshold=Math.round(10 + amount*0.7);
  for(let i=0;i<d.length;i+=4){
    const a=d[i+3];
    if(a<threshold) d[i+3]=0;
  }
  o.putImageData(id,0,0);

  const out=new Image();
  return new Promise(resolve=>{
    out.onload=()=>resolve(out);
    out.src=off.toDataURL('image/png');
  });
}

async function refreshCleanup(){
  if(!state.rawCutout)return;
  const amount=+document.getElementById('cleanup').value;
  state.charImg=await applyCleanup(state.rawCutout,amount);
  draw();
}

function loadFile(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    state.sourceImg=img;
    state.rawCutout=null;
    state.charImg=img;
    state.x=-260;state.y=20;state.scale=1.4;state.flip=false;
    syncControls();draw();
    setStatus('画像を読み込みました。次に「女の子だけ自動切り抜き」を押してください。');
  };
  img.src=url;
}
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files?.[0];if(f)loadFile(f);
});

document.getElementById('removeBg').addEventListener('click',async()=>{
  const file=document.getElementById('file').files?.[0];
  if(!file){setStatus('先に配信スクショを選んでください。');return;}
  const btn=document.getElementById('removeBg');
  btn.disabled=true;btn.textContent='AIを準備中…';

  try{
    setStatus('背景透過AIを読み込み中です。初回は少し待つことがあります…');
    const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
    btn.textContent='背景を切り抜き中…';

    const blob=await mod.removeBackground(file,{
      model:'small',
      output:{format:'image/png',quality:1},
      progress:(key,current,total)=>{
        if(total)setStatus(`自動切り抜き中… ${Math.round(current/total*100)}%`);
      }
    });

    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=async()=>{
      state.rawCutout=img;
      state.charImg=await applyCleanup(img,+document.getElementById('cleanup').value);
      state.x=-260;state.y=20;state.scale=1.4;
      syncControls();draw();
      setStatus('✨ 切り抜き完了！ 今回は追加削除0なので、白い服や淡い部分をかなり残しやすくしています。');
      btn.disabled=false;btn.textContent='✂️ 女の子だけ自動切り抜き';
    };
    img.src=url;
  }catch(err){
    console.error(err);
    setStatus('自動切り抜きに失敗しました。「そのまま使う」でも画像作成はできます。');
    btn.disabled=false;btn.textContent='✂️ 女の子だけ自動切り抜き';
  }
});

document.getElementById('useOriginal').addEventListener('click',()=>{
  if(!state.sourceImg){setStatus('先に画像を選んでください。');return;}
  state.charImg=state.sourceImg;state.rawCutout=null;draw();
  setStatus('元画像をそのまま使用しています。');
});

document.getElementById('cleanup').addEventListener('input',async e=>{
  document.getElementById('cleano').value=e.target.value;
  await refreshCleanup();
});

function randomizePosition(){
  state.x=Math.random()<.78 ? (-230-rand(100)) : (210+rand(80));
  state.y=-10+rand(50);
  state.scale=1.25+Math.random()*.35;
  state.flip=Math.random()<.2;
  syncControls();
}

document.getElementById('randomAll').addEventListener('click',()=>{
  state.bg=rand(palettes.length);
  state.frame=rand(4);
  state.layout=rand(4);
  chooseMessage();
  randomizePosition();
  draw();
  setStatus('🎲 全部ランダムにしました。');
});
document.getElementById('randomMsg').addEventListener('click',()=>{chooseMessage();draw();});
document.getElementById('randomBg').addEventListener('click',()=>{state.bg=rand(palettes.length);draw();});
document.getElementById('randomFrame').addEventListener('click',()=>{state.frame=rand(4);draw();});
document.getElementById('randomLayout').addEventListener('click',()=>{state.layout=rand(4);draw();});
document.getElementById('randomPos').addEventListener('click',()=>{randomizePosition();draw();});
document.getElementById('tone').addEventListener('change',()=>{chooseMessage();draw();});
document.getElementById('flip').addEventListener('click',()=>{state.flip=!state.flip;draw();});

function syncControls(){
  document.getElementById('x').value=Math.round(state.x);
  document.getElementById('y').value=Math.round(state.y);
  document.getElementById('scale').value=Math.round(state.scale*100);
  document.getElementById('xo').value=Math.round(state.x);
  document.getElementById('yo').value=Math.round(state.y);
  document.getElementById('so').value=Math.round(state.scale*100)+'%';
}
['x','y','scale'].forEach(id=>{
  document.getElementById(id).addEventListener('input',e=>{
    if(id==='scale')state.scale=+e.target.value/100;
    else state[id]=+e.target.value;
    syncControls();draw();
  });
});

function point(ev){
  const r=cv.getBoundingClientRect();
  const t=ev.touches?.[0]||ev.changedTouches?.[0];
  const cx=t?t.clientX:ev.clientX,cy=t?t.clientY:ev.clientY;
  return {x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height};
}
function start(ev){
  if(!state.charImg)return;
  state.drag=true;
  const p=point(ev);state.lastX=p.x;state.lastY=p.y;
  ev.preventDefault();
}
function move(ev){
  if(!state.drag)return;
  const p=point(ev);
  state.x+=p.x-state.lastX;
  state.y+=p.y-state.lastY;
  state.lastX=p.x;state.lastY=p.y;
  syncControls();draw();ev.preventDefault();
}
function end(){state.drag=false}
cv.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);

document.getElementById('save').addEventListener('click',()=>{
  draw();
  const a=document.createElement('a');
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  a.download=`ohayou_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.png`;
  a.href=cv.toDataURL('image/png');a.click();
  setStatus('PNGを書き出しました 🌞');
});

document.getElementById('reset').addEventListener('click',()=>{
  state.bg=0;state.frame=0;state.layout=0;state.msg='今日もいい日になりますように♡';
  state.x=-260;state.y=20;state.scale=1.4;state.flip=false;
  document.getElementById('cleanup').value=0;
  document.getElementById('cleano').value=0;
  syncControls();draw();setStatus('初期状態に戻しました。');
});

state.msg='今日もいい日になりますように♡';
draw();
</script>
</body>
