<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おはよう画像メーカー v1.4</title><style>
:root{--ink:#352f44;--muted:#81798e;--line:#ece7f4;--panel:#fff;--bg:#f7f4fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:860px;margin:0 auto;padding:14px 12px 40px}h1{font-size:22px;margin:6px 0 3px}.lead{font-size:13px;color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 5px 20px rgba(72,55,105,.06)}.preview-shell{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#eee}canvas{width:100%;height:100%;display:block;touch-action:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button,.filebtn,select,input[type=range]{font:inherit}button,.filebtn{width:100%;border:0;border-radius:13px;padding:12px 10px;font-weight:800;cursor:pointer;text-align:center}.primary{background:linear-gradient(135deg,#8c75ec,#bd8cf5);color:#fff}.pink{background:linear-gradient(135deg,#f57ba8,#f5a36e);color:#fff}.soft{background:#f2eff8;color:#554b6b}.danger{background:#fff0f2;color:#b24b5f}.filebtn{display:block;background:#f0ecff;color:#6651ba}input[type=file]{display:none}.section-title{font-weight:900;margin-bottom:8px}.status{margin-top:8px;padding:9px 10px;border-radius:10px;background:#faf8ff;color:#665c79;font-size:12px;line-height:1.55}.small,.tip{font-size:12px;color:var(--muted);line-height:1.6}.row{display:flex;gap:8px}.row>*{flex:1}select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:white}label.slider{display:grid;grid-template-columns:82px 1fr 58px;gap:8px;align-items:center;margin:8px 0;font-size:13px}label.slider output{text-align:right;color:#6d647d}input[type=range]{width:100%}.pill{display:inline-block;background:#f1edff;color:#6c58c0;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.footer{font-size:11px;color:#9891a3;text-align:center;margin-top:16px}@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<h1>🌞 おはよう画像メーカー v1.4</h1><div class="lead">左右配置でも文字バランスが崩れにくいよう調整。切り抜き補正バーはリアルタイム反映。フレームは太く、かわいい系に強化。</div>
<div class="card"><div class="preview-shell"><canvas id="cv" width="1200" height="675"></canvas></div><div id="status" class="status">① 今日の配信スクショを選んでください。</div></div>
<div class="card"><div class="section-title">① 今日の女の子を入れる</div><label class="filebtn" for="file">📸 配信スクショを選ぶ</label><input id="file" type="file" accept="image/*"><div class="grid2" style="margin-top:8px"><button id="removeBg" class="pink">✂️ 女の子だけ自動切り抜き</button><button id="useOriginal" class="soft">そのまま使う</button></div>
<label class="slider"><span>ゴミ掃除</span><input id="cleanup" type="range" min="0" max="100" value="10"><output id="cleano">10</output></label>
<label class="slider"><span>エッジ保護</span><input id="edge" type="range" min="0" max="100" value="75"><output id="edgeo">75</output></label>
<div class="tip">ゴミ掃除を上げるほど薄い背景残りを消します。エッジ保護を上げるほど白い服・髪・細いパーツを残します。<span class="pill">リアルタイム反映</span></div></div>
<div class="card"><div class="section-title">② ワンタップで作る</div><button id="randomAll" class="primary">✨ 全部ランダム作成</button><div class="grid3" style="margin-top:8px"><button id="randomMsg" class="soft">💬 文字だけ</button><button id="randomBg" class="soft">🎨 背景だけ</button><button id="randomFrame" class="soft">🖼 フレームだけ</button></div><div class="grid2" style="margin-top:8px"><button id="randomLayout" class="soft">🔤 文字配置だけ</button><button id="randomPos" class="soft">👧 女の子配置だけ</button></div><div class="row" style="margin-top:8px"><select id="tone"><option value="auto">文章：おまかせ</option><option value="genki">文章：元気</option><option value="gentle">文章：やさしい</option><option value="yurui">文章：ゆるい</option><option value="ouen">文章：応援</option></select></div></div>
<div class="card"><div class="section-title">③ 女の子を微調整</div><div class="small">画像上でドラッグしても動かせます。</div><label class="slider"><span>左右</span><input id="x" type="range" min="-500" max="500" value="-260"><output id="xo">-260</output></label><label class="slider"><span>上下</span><input id="y" type="range" min="-300" max="300" value="20"><output id="yo">20</output></label><label class="slider"><span>大きさ</span><input id="scale" type="range" min="40" max="220" value="140"><output id="so">140%</output></label><button id="flip" class="soft">↔️ 左右反転</button></div>
<div class="card"><div class="section-title">④ 保存</div><div class="grid2"><button id="save" class="primary">⬇️ PNGで保存</button><button id="reset" class="danger">リセット</button></div></div><div class="footer">おはよう画像メーカー v1.4</div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const state={sourceImg:null,rawCutout:null,charImg:null,x:-260,y:20,scale:1.4,flip:false,bg:0,frame:0,layout:0,msg:'今日もいい日になりますように♡',drag:false,lastX:0,lastY:0,timer:null};
const palettes=[{bg:'#f7bfd9',hot:'#ff5eaa',cyan:'#8ee4e5',purple:'#a98bf2',yellow:'#ffd95f',cream:'#fff4df',white:'#fff'},{bg:'#cda0e7',hot:'#ffcc00',cyan:'#bff3ff',purple:'#7f6ee9',yellow:'#ffe36a',cream:'#f8d5ff',white:'#fff'},{bg:'#f8b6df',hot:'#ff6cb7',cyan:'#8ed6dd',purple:'#c5a2ff',yellow:'#ffdf78',cream:'#fff4c9',white:'#fff'},{bg:'#ffd0dc',hot:'#ff7b9e',cyan:'#92d9de',purple:'#aa90ef',yellow:'#ffc65f',cream:'#fff7e6',white:'#fff'}];
const messages={genki:['今日もたのしくいこ〜！','今日も元気にいってらっしゃい！','いっぱい笑える日になりますように！','いいこと見つけにいこっ！','今日もハッピー見つけよ〜！'],gentle:['今日もいい日になりますように♡','無理せず自分のペースでいこ〜！','今日もやさしい時間がありますように','ひとつずつ、ゆっくりいこ〜！'],yurui:['ゆるっと今日もいこ〜！','ぼちぼちがんばろ〜！','今日もマイペースでいこっ！','気楽にいこ〜！'],ouen:['今日もあなたらしくいけますように！','今日も応援してるよっ！','大丈夫、ひとつずついこ〜！','できるところからで大丈夫！']};let recent=[];
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],setStatus=t=>document.getElementById('status').textContent=t;
function chooseMessage(){let tone=document.getElementById('tone').value;if(tone==='auto')tone=pick(['genki','genki','gentle','yurui','ouen']);let pool=messages[tone].filter(x=>!recent.includes(x));if(!pool.length)pool=messages[tone];state.msg=pick(pool);recent.push(state.msg);if(recent.length>8)recent.shift();}
function rr(x,y,w,h,r,fill,stroke=null,line=0){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}}
function circle(x,y,r,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function star(x,y,r,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){let ang=-Math.PI/2+i*Math.PI/5,rad=i%2===0?r:r*.44;let px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function heart(x,y,s,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-18,-5,-14,-22,0,-14);ctx.bezierCurveTo(14,-22,18,-5,0,8);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function flower(x,y,s,p){circle(x,y,14*s,p.yellow);[[0,-34],[32,-10],[20,28],[-20,28],[-32,-10]].forEach(([dx,dy])=>circle(x+dx*s,y+dy*s,20*s,p.cream));}
function bow(x,y,s,p){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=p.hot;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-20,-18,-46,-18,-40,10);ctx.bezierCurveTo(-35,30,-10,20,0,8);ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(20,-18,46,-18,40,10);ctx.bezierCurveTo(35,30,10,20,0,8);ctx.fill();circle(0,6,9,p.yellow);ctx.restore();}
function drawBackground(){let p=palettes[state.bg%palettes.length];ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,H);for(let i=0;i<18;i++)circle(60+rand(1080),50+rand(570),8+rand(34),[p.hot,p.cyan,p.purple,p.yellow][i%4],.5);for(let i=0;i<14;i++)heart(70+rand(1060),60+rand(550),.45+Math.random()*.7,p.hot,.7);for(let i=0;i<12;i++)star(70+rand(1060),60+rand(550),10+rand(14),p.yellow,.9);}
function drawFrame(){let p=palettes[state.bg%palettes.length],f=state.frame%4;rr(22,20,W-44,H-40,46,'rgba(255,255,255,.02)',p.white,20);if(f===0){rr(44,42,W-88,H-84,34,'rgba(255,255,255,.02)',p.hot,16);rr(62,60,W-124,H-120,28,'rgba(255,255,255,.01)',p.purple,7);bow(105,98,.9,p);bow(W-105,H-98,.9,p);}else if(f===1){rr(42,40,W-84,H-80,34,'rgba(255,255,255,.02)',p.purple,18);for(let x=95;x<W-95;x+=100)star(x,78,10,p.yellow,.95);for(let x=95;x<W-95;x+=100)heart(x,H-78,.55,p.hot,.9);}else if(f===2){rr(42,40,W-84,H-80,34,'rgba(255,255,255,.02)',p.hot,17);rr(60,58,W-120,H-116,28,'rgba(255,255,255,.01)',p.white,9);flower(92,98,.75,p);flower(W-92,98,.75,p);flower(92,H-98,.75,p);flower(W-92,H-98,.75,p);}else{rr(42,40,W-84,H-80,34,'rgba(255,255,255,.02)',p.yellow,16);for(let i=0;i<5;i++){bow(170+i*215,80,.62,p);bow(170+i*215,H-80,.62,p);}}}
function drawCharacter(){if(!state.charImg)return;let img=state.charImg,h=680*state.scale,w=h*(img.naturalWidth/img.naturalHeight),cx=W/2+state.x,bottom=H/2+160+state.y;ctx.save();ctx.translate(cx,bottom);ctx.scale(state.flip?-1:1,1);ctx.drawImage(img,-w/2,-h,w,h);ctx.restore();}
function font(size){return `900 ${size}px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif`;}
function splitJ(text,maxW,size,maxLines=3){ctx.font=font(size);let lines=[],line='';for(let ch of text){let t=line+ch;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=ch}else line=t}if(line)lines.push(line);return lines.slice(0,maxLines);}
function outlined(text,x,y,size,fill,stroke,stroke2=null){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.font=font(size);if(stroke2){ctx.lineWidth=size*.22;ctx.strokeStyle=stroke2;ctx.strokeText(text,x,y)}ctx.lineWidth=size*.13;ctx.strokeStyle=stroke;ctx.strokeText(text,x,y);ctx.fillStyle=fill;ctx.fillText(text,x,y);ctx.restore();}
function zone(){return state.x<0?{x:610,w:500,cx:860}:{x:90,w:500,cx:340};}
function drawText(){let p=palettes[state.bg%palettes.length],L=state.layout%4,z=zone();if(L===0){outlined('今日もたのしい1日に',z.cx,110,27,p.white,p.purple,p.yellow);outlined('おはよう！',z.cx,205,108,p.white,p.hot,p.yellow);let s=48,lines=splitJ(state.msg,z.w,s,3),gap=s*1.05,start=420-(lines.length-1)*gap/2;lines.forEach((t,i)=>outlined(t,z.cx,start+i*gap,s,p.white,p.hot));}else if(L===1){outlined('おはよう',W/2,116,124,p.white,p.purple);let s=56,lines=splitJ(state.msg,900,s,2),start=H-118-(lines.length-1)*34;lines.forEach((t,i)=>outlined(t,W/2,start+i*68,s,p.white,p.purple));}else if(L===2){outlined('おはよう',z.cx,205,114,p.white,p.cyan);let s=56,lines=splitJ(state.msg,z.w,s,3),start=385-(lines.length-1)*31;lines.forEach((t,i)=>outlined(t,z.cx,start+i*64,s,p.white,p.cyan));}else{rr(z.x,130,z.w,390,36,'rgba(255,255,255,.16)',p.white,6);outlined('おはよう！',z.cx,235,98,p.white,p.purple,p.yellow);let s=45,lines=splitJ(state.msg,z.w-50,s,3),start=390-(lines.length-1)*28;lines.forEach((t,i)=>outlined(t,z.cx,start+i*58,s,p.white,p.hot));}}
function draw(){drawBackground();drawFrame();drawCharacter();drawText();}
async function rebuildCutout(){if(!state.rawCutout)return;let cleanup=+document.getElementById('cleanup').value,edge=+document.getElementById('edge').value,img=state.rawCutout,off=document.createElement('canvas');off.width=img.naturalWidth||img.width;off.height=img.naturalHeight||img.height;let o=off.getContext('2d');o.drawImage(img,0,0);let id=o.getImageData(0,0,off.width,off.height),d=id.data,low=4+cleanup*.65,feather=30+cleanup*.6,protect=edge/100;for(let i=0;i<d.length;i+=4){let a=d[i+3];if(a<low){d[i+3]=0;continue}if(a<feather){let t=(a-low)/Math.max(1,feather-low),keep=(.25+.75*t)*(.55+.45*protect);d[i+3]=Math.round(a*keep);continue}if(a<230)d[i+3]=Math.min(255,Math.round(a+(230-a)*protect*.35));}o.putImageData(id,0,0);let out=new Image();await new Promise(r=>{out.onload=r;out.src=off.toDataURL('image/png')});state.charImg=out;draw();}
function schedule(){clearTimeout(state.timer);state.timer=setTimeout(rebuildCutout,60);}
function loadFile(file){let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{state.sourceImg=img;state.rawCutout=null;state.charImg=img;state.x=-260;state.y=20;state.scale=1.4;sync();draw();setStatus('画像を読み込みました。次に「女の子だけ自動切り抜き」を押してください。')};img.src=url}
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files?.[0];if(f)loadFile(f)});
document.getElementById('removeBg').addEventListener('click',async()=>{let file=document.getElementById('file').files?.[0];if(!file){setStatus('先に配信スクショを選んでください。');return}let btn=document.getElementById('removeBg');btn.disabled=true;btn.textContent='AIを準備中…';try{setStatus('背景透過AIを読み込み中…');let mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');btn.textContent='背景を切り抜き中…';let blob=await mod.removeBackground(file,{model:'small',output:{format:'image/png',quality:1}}),url=URL.createObjectURL(blob),img=new Image();img.onload=async()=>{state.rawCutout=img;await rebuildCutout();state.x=-260;state.y=20;state.scale=1.4;sync();draw();setStatus('✨ 切り抜き完了！ ゴミ掃除とエッジ保護を動かすとリアルタイムで変わります。');btn.disabled=false;btn.textContent='✂️ 女の子だけ自動切り抜き'};img.src=url}catch(err){console.error(err);setStatus('自動切り抜きに失敗しました。');btn.disabled=false;btn.textContent='✂️ 女の子だけ自動切り抜き'}});
document.getElementById('useOriginal').addEventListener('click',()=>{if(state.sourceImg){state.charImg=state.sourceImg;state.rawCutout=null;draw()}});
document.getElementById('cleanup').addEventListener('input',e=>{document.getElementById('cleano').value=e.target.value;schedule()});
document.getElementById('edge').addEventListener('input',e=>{document.getElementById('edgeo').value=e.target.value;schedule()});
function randomPos(){state.x=Math.random()<.75?(-235-rand(95)):(225+rand(80));state.y=-10+rand(45);state.scale=1.24+Math.random()*.34;state.flip=Math.random()<.18;sync()}
document.getElementById('randomAll').addEventListener('click',()=>{state.bg=rand(palettes.length);state.frame=rand(4);state.layout=rand(4);chooseMessage();randomPos();draw()});
document.getElementById('randomMsg').addEventListener('click',()=>{chooseMessage();draw()});document.getElementById('randomBg').addEventListener('click',()=>{state.bg=rand(palettes.length);draw()});document.getElementById('randomFrame').addEventListener('click',()=>{state.frame=rand(4);draw()});document.getElementById('randomLayout').addEventListener('click',()=>{state.layout=rand(4);draw()});document.getElementById('randomPos').addEventListener('click',()=>{randomPos();draw()});document.getElementById('tone').addEventListener('change',()=>{chooseMessage();draw()});document.getElementById('flip').addEventListener('click',()=>{state.flip=!state.flip;draw()});
function sync(){x.value=Math.round(state.x);y.value=Math.round(state.y);scale.value=Math.round(state.scale*100);xo.value=Math.round(state.x);yo.value=Math.round(state.y);so.value=Math.round(state.scale*100)+'%'}
['x','y','scale'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{if(id==='scale')state.scale=+e.target.value/100;else state[id]=+e.target.value;sync();draw()}));
function point(ev){let r=cv.getBoundingClientRect(),t=ev.touches?.[0]||ev.changedTouches?.[0],cx=t?t.clientX:ev.clientX,cy=t?t.clientY:ev.clientY;return{x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height}}
function start(ev){if(!state.charImg)return;state.drag=true;let p=point(ev);state.lastX=p.x;state.lastY=p.y;ev.preventDefault()}function move(ev){if(!state.drag)return;let p=point(ev);state.x+=p.x-state.lastX;state.y+=p.y-state.lastY;state.lastX=p.x;state.lastY=p.y;sync();draw();ev.preventDefault()}function end(){state.drag=false}
cv.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
document.getElementById('save').addEventListener('click',()=>{draw();let a=document.createElement('a'),d=new Date(),pad=n=>String(n).padStart(2,'0');a.download=`ohayou_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.png`;a.href=cv.toDataURL('image/png');a.click()});
document.getElementById('reset').addEventListener('click',()=>{state.bg=0;state.frame=0;state.layout=0;state.msg='今日もいい日になりますように♡';state.x=-260;state.y=20;state.scale=1.4;state.flip=false;cleanup.value=10;edge.value=75;cleano.value=10;edgeo.value=75;if(state.rawCutout)rebuildCutout();sync();draw()});
draw();
</script></body></html>
