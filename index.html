<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おはよう画像メーカー v1.1</title>
<style>
  :root{
    --ink:#342d45; --muted:#7f7890; --panel:#ffffff; --line:#e9e4f2;
    --accent:#8f7ae6; --bg:#f7f4fb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 40px}
  h1{font-size:22px;margin:6px 0 2px}
  .lead{font-size:13px;color:var(--muted);margin-bottom:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 5px 20px rgba(72,55,105,.06)}
  .preview-shell{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#eee;position:relative}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  button,.filebtn,select,input[type=range]{font:inherit}
  button,.filebtn{width:100%;border:0;border-radius:13px;padding:12px 10px;font-weight:800;cursor:pointer;text-align:center}
  .primary{background:linear-gradient(135deg,var(--accent),#b291ef);color:#fff}
  .pink{background:linear-gradient(135deg,#f28eae,#f6b07e);color:#fff}
  .soft{background:#f2eff8;color:#554b6b}
  .danger{background:#fff0f2;color:#b24b5f}
  .filebtn{display:block;background:#f0ecff;color:#6651ba}
  input[type=file]{display:none}
  .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
  .small{font-size:12px;color:var(--muted)}
  .status{margin-top:8px;padding:9px 10px;border-radius:10px;background:#faf8ff;color:#665c79;font-size:12px;line-height:1.5}
  .section-title{font-weight:900;margin-bottom:8px}
  label.slider{display:grid;grid-template-columns:70px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
  label.slider output{text-align:right;color:#6d647d;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%}
  select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink)}
  .pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#f0ecff;color:#6b58bc;font-size:11px;font-weight:800;margin-left:4px}
  .tip{font-size:12px;line-height:1.6;color:#6f687c}
  .footer{font-size:11px;color:#978fa2;text-align:center;margin-top:16px}
  @media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}h1{font-size:20px}.wrap{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌞 おはよう画像メーカー v1.1</h1>
  <div class="lead">切り抜き後のゴミ残りを減らし、背景と飾りをもっとゴチャゴチャにした改良版。</div>

  <div class="card">
    <div class="preview-shell"><canvas id="cv" width="1200" height="675"></canvas></div>
    <div class="status" id="status">① 今日の配信スクショを選んでください。人物が大きめに写っているほど切り抜きが安定します。</div>
  </div>

  <div class="card">
    <div class="section-title">① 今日の女の子を入れる</div>
    <label class="filebtn" for="file">📸 配信スクショを選ぶ</label>
    <input id="file" type="file" accept="image/*">
    <div class="grid2" style="margin-top:8px">
      <button id="removeBg" class="pink">✂️ 女の子だけ自動切り抜き</button>
      <button id="useOriginal" class="soft">そのまま使う</button>
    </div>
    <div class="tip" style="margin-top:8px">
      自動切り抜き後に、半透明のゴミを自動で掃除します。
      <span class="pill">画像は外部へ送信しない方式</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">② ワンタップで作る</div>
    <button id="randomAll" class="primary">✨ 全部ランダム作成</button>
    <div class="grid3" style="margin-top:8px">
      <button id="randomMsg" class="soft">💬 文字だけ</button>
      <button id="randomBg" class="soft">🎨 背景だけ</button>
      <button id="randomDeco" class="soft">⭐ 飾りだけ</button>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="tone">
        <option value="auto">文章：おまかせ</option>
        <option value="gentle">文章：やさしい</option>
        <option value="genki">文章：元気</option>
        <option value="yurui">文章：ゆるい</option>
        <option value="ouen">文章：応援</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="section-title">③ 女の子の位置だけ微調整</div>
    <div class="small">キャンバス上でドラッグしても動かせます。</div>
    <label class="slider"><span>左右</span><input id="x" type="range" min="-500" max="500" value="-210"><output id="xo">-210</output></label>
    <label class="slider"><span>上下</span><input id="y" type="range" min="-350" max="350" value="18"><output id="yo">18</output></label>
    <label class="slider"><span>大きさ</span><input id="scale" type="range" min="20" max="240" value="135"><output id="so">135%</output></label>
    <div class="grid2">
      <button id="flip" class="soft">↔️ 左右反転</button>
      <button id="randomPos" class="soft">🎲 配置だけランダム</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">④ 保存</div>
    <div class="grid2">
      <button id="save" class="primary">⬇️ PNGで保存</button>
      <button id="reset" class="danger">リセット</button>
    </div>
    <div class="small" style="margin-top:8px">出力サイズ：1200 × 675 px（16:9）</div>
  </div>
  <div class="footer">おはよう画像メーカー v1.1</div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const state={sourceImg:null,charImg:null,charURL:null,x:-210,y:18,scale:1.35,flip:false,bgIndex:0,decoIndex:0,msg:"",drag:false,lastX:0,lastY:0};
const palettes=[
 ['#fff2f7','#f8bed0','#a993ef','#fff7da','#f8d8f2','#bcaaf7'],
 ['#edf8ff','#9fd8ff','#7e8ee8','#fff1b7','#d7f2ff','#a6b9ff'],
 ['#f3efff','#c8b5ff','#f0a5c2','#fff8e9','#eadcff','#ffcee4'],
 ['#f1fff8','#a8e3c3','#f7c77c','#fff9e7','#dbfff0','#cce7a3'],
 ['#fff8ea','#f5be7a','#ef8fa8','#ffe9f2','#ffe2ad','#ffbfd6'],
 ['#effcff','#8ed7d9','#ab9ded','#f9d4e2','#d8ffff','#d4c8ff'],
 ['#fff1ef','#ffb0a6','#ffd48d','#95d8cc','#ffd9d1','#ffefb8'],
 ['#f7f2ff','#b6a8ff','#8dd0eb','#ffc1d9','#ebe3ff','#b6e9ff']
];
const messages={
 gentle:["今日もいい日になりますように♡","無理せず自分のペースでいこ〜！","今日もやさしい時間がありますように","ひとつずつ、ゆっくりいこ〜！","肩の力をぬいていってらっしゃい！","今日も穏やかに過ごせますように","自分らしくいけたらそれで十分◎","今日も小さないいこと見つけよ〜"],
 genki:["今日も元気にいってらっしゃい！","いっぱい笑える日になりますように！","今日もたのしくいこ〜！！","いいこと見つけにいこっ！","今日もハッピー見つけよ〜！","笑顔でスタートしてこ〜！","今日もキラキラないちにちに！","元気チャージしていこ〜！"],
 yurui:["ゆるっと今日もいこ〜！","ぼちぼちがんばろ〜！","のんびりでも大丈夫◎","今日もマイペースでいこっ！","なんとかなる〜の気持ちでいこ！","気楽にいこ〜！","ちょっとずつでえらい！","今日もほどほどにがんばろ〜！"],
 ouen:["今日もあなたらしくいけますように！","小さな一歩でもすごいよ〜！","今日も応援してるよっ！","きっといい流れになりますように！","大丈夫、ひとつずついこ〜！","今日も前向きにいけますように！","できるところからで大丈夫！","いい一日になる予感〜！"]
};
let recent=[];

const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=n=>Math.floor(Math.random()*n);
const setStatus=t=>document.getElementById('status').textContent=t;
function chooseMessage(){
  let tone=document.getElementById('tone').value;
  if(tone==='auto') tone=pick(['gentle','gentle','yurui','yurui','genki','ouen']);
  let pool=messages[tone].filter(x=>!recent.includes(x));
  if(!pool.length) pool=messages[tone];
  state.msg=pick(pool);
  recent.push(state.msg); if(recent.length>8) recent.shift();
}
function roundRect(x,y,w,h,r,fill,stroke=null,line=0){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=line;ctx.strokeStyle=stroke;ctx.stroke();}}
function circle(x,y,r,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function star(x,y,r,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5;const rr=i%2===0?r:r*.45;const px=Math.cos(ang)*rr, py=Math.sin(ang)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function heart(x,y,s,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-18,-5,-14,-22,0,-14);ctx.bezierCurveTo(14,-22,18,-5,0,8);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function blob(x,y,w,h,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(w,h);ctx.beginPath();ctx.moveTo(-.45,-.05);ctx.bezierCurveTo(-.5,-.5,.05,-.58,.36,-.31);ctx.bezierCurveTo(.62,-.08,.4,.43,.02,.48);ctx.bezierCurveTo(-.36,.54,-.64,.29,-.45,-.05);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function doodle(points,color,width=6,a=.45){ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();ctx.restore();}
function ribbon(x,y,w,h,color,rot=.05){ctx.save();ctx.translate(x,y);ctx.rotate(rot);roundRect(-w/2,-h/2,w,h,8,color);ctx.restore();}
function dashFrame(x,y,w,h,stroke){ctx.save();ctx.lineWidth=6;ctx.setLineDash([10,8]);ctx.strokeStyle=stroke;ctx.strokeRect(x,y,w,h);ctx.restore();}

function drawBg(){
  const p=palettes[state.bgIndex%palettes.length];
  ctx.fillStyle=p[0];ctx.fillRect(0,0,W,H);
  roundRect(18,18,W-36,H-36,34,'rgba(255,255,255,0.35)');
  roundRect(34,34,W-68,H-68,26,'rgba(255,255,255,0.22)');
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.25)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  blob(165,112,170,90,p[1],.35); blob(1010,560,180,95,p[2],.28); blob(995,108,110,58,p[3],.45); blob(125,575,120,62,p[4],.38); blob(563,84,110,50,p[5],.14);
  circle(1120,570,18,p[2],.55); circle(1080,120,11,p[1],.5); circle(105,510,12,p[5],.55);
  ribbon(860,84,160,28,p[3],-.05); ribbon(318,67,120,24,p[4],.08); ribbon(976,617,130,24,p[1],.03);
  for(let i=0;i<25;i++) circle(60+rand(1080),50+rand(575),3+rand(5),p[1+rand(5)],.45);
  dashFrame(58,72,450,520,'rgba(255,255,255,.45)');
}

function drawDeco(){
  const p=palettes[state.bgIndex%palettes.length];
  const d=state.decoIndex%8;
  for(let i=0;i<7;i++) star(56+rand(1088),52+rand(560),8+rand(14),p[1+rand(5)],.65);
  for(let i=0;i<8;i++) heart(60+rand(1085),55+rand(560),.35+Math.random()*.45,p[1+rand(5)],.6);
  if(d===0){
    doodle([[845,125],[878,103],[920,117],[954,96],[995,117]], p[2], 8, .22);
    doodle([[837,534],[875,507],[912,530],[968,498],[1014,525]], p[1], 8, .20);
  }else if(d===1){
    for(let i=0;i<4;i++){ctx.save();ctx.globalAlpha=.18;ctx.lineWidth=10;ctx.strokeStyle=p[1+i];ctx.beginPath();ctx.arc(975,520,55+i*22,.2,5.5);ctx.stroke();ctx.restore();}
  }else if(d===2){
    for(let i=0;i<4;i++) ribbon(825+i*85,120+(i%2)*26,58,18,p[1+i],(-.1)+(i*.04));
  }else if(d===3){
    doodle([[124,158],[162,135],[208,152],[248,121],[286,140]], p[5], 7, .28);
    doodle([[986,179],[1036,162],[1078,182],[1122,153]], p[2], 7, .28);
  }else if(d===4){
    for(let i=0;i<3;i++){ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle=p[1+i];ctx.lineWidth=12;ctx.beginPath();ctx.arc(1060,144,42+i*22,3.5,6.2);ctx.stroke();ctx.restore();}
  }else if(d===5){
    for(let i=0;i<5;i++) blob(812+i*70,526+(i%2)*25,35,20,p[1+i%5],.55);
  }else if(d===6){
    roundRect(880,506,145,84,22,'rgba(255,255,255,.30)','rgba(255,255,255,.35)',4);
    star(905,530,13,p[2],.72); heart(975,550,.75,p[1],.72);
  }else{
    for(let i=0;i<6;i++) circle(820+i*55,525+(i%2)*18,9+i%3,p[1+i%5],.65);
  }
}
async function cleanCutoutToImage(img, alphaThreshold=170){
  const off=document.createElement('canvas'); off.width=img.naturalWidth||img.width; off.height=img.naturalHeight||img.height;
  const octx=off.getContext('2d'); octx.drawImage(img,0,0);
  const imageData=octx.getImageData(0,0,off.width,off.height); const d=imageData.data;
  for(let i=0;i<d.length;i+=4){
    const a=d[i+3];
    if(a<alphaThreshold){d[i+3]=0;}
    else{d[i+3]=Math.min(255, Math.round(180 + (a-alphaThreshold)*(75/(255-alphaThreshold||1))));}
    const avg=(d[i]+d[i+1]+d[i+2])/3;
    const spread=Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]);
    if(d[i+3] && avg>242 && spread<12) d[i+3]=0;
  }
  octx.putImageData(imageData,0,0);
  const id2=octx.getImageData(0,0,off.width,off.height).data;
  let minX=off.width, minY=off.height, maxX=0, maxY=0, found=false;
  for(let y=0;y<off.height;y++){
    for(let x=0;x<off.width;x++){
      const a=id2[(y*off.width+x)*4+3];
      if(a>20){found=true; if(x<minX)minX=x; if(y<minY)minY=y; if(x>maxX)maxX=x; if(y>maxY)maxY=y;}
    }
  }
  const out=document.createElement('canvas');
  const margin=10;
  if(found){
    minX=Math.max(0,minX-margin); minY=Math.max(0,minY-margin); maxX=Math.min(off.width-1,maxX+margin); maxY=Math.min(off.height-1,maxY+margin);
    out.width=maxX-minX+1; out.height=maxY-minY+1;
    out.getContext('2d').drawImage(off,minX,minY,out.width,out.height,0,0,out.width,out.height);
  }else{
    out.width=off.width; out.height=off.height; out.getContext('2d').drawImage(off,0,0);
  }
  const cleaned=new Image();
  return new Promise(resolve=>{cleaned.onload=()=>resolve(cleaned);cleaned.src=out.toDataURL('image/png');});
}
function drawCharacter(){
  if(!state.charImg) return;
  const img=state.charImg;
  const baseH=680*state.scale, baseW=baseH*(img.naturalWidth/img.naturalHeight);
  const anchorX=W/2+state.x, feetY=H/2+150+state.y;
  ctx.save(); ctx.translate(anchorX,feetY); ctx.scale(state.flip?-1:1,1);
  ctx.save();ctx.filter='blur(14px)';ctx.globalAlpha=.12;ctx.fillStyle='rgba(80,40,110,.55)';ctx.beginPath();ctx.ellipse(0, baseH*0.39, baseW*0.19, baseH*0.045, 0, 0, Math.PI*2);ctx.fill();ctx.restore();
  ctx.drawImage(img,-baseW/2,-baseH,baseW,baseH);
  ctx.restore();
}
function wrapText(text,maxWidth,font){
  ctx.font=font; const lines=[]; let line="";
  for(const ch of text){const test=line+ch;if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=ch;}else line=test;}
  if(line) lines.push(line); return lines.slice(0,3);
}
function drawText(){
  const p=palettes[state.bgIndex%palettes.length];
  const left=state.x<0, boxX=left?565:70, boxW=560;
  roundRect(boxX+20,145,boxW-40,300,34,'rgba(255,255,255,.18)');
  roundRect(boxX+40,170,boxW-80,250,30,'rgba(255,255,255,.10)');
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.font='900 96px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.lineWidth=18; ctx.strokeStyle='rgba(255,255,255,.97)'; ctx.strokeText('おはよう！',boxX+boxW/2,238);
  ctx.fillStyle=p[2]; ctx.fillText('おはよう！',boxX+boxW/2,238);
  const lines=wrapText(state.msg,460,'800 39px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif');
  ctx.font='800 39px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  lines.forEach((line,i)=>{const yy=334+i*54;ctx.lineWidth=10;ctx.strokeStyle='rgba(255,255,255,.92)';ctx.strokeText(line,boxX+boxW/2,yy);ctx.fillStyle='#4d4258';ctx.fillText(line,boxX+boxW/2,yy);});
  ctx.font='700 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  roundRect(boxX+115,110,210,40,16,'rgba(255,255,255,.55)');
  ctx.fillStyle=p[2]; ctx.fillText('今日もたのしい1日に',boxX+220,131);
  ctx.restore();
}
function draw(){drawBg();drawDeco();drawCharacter();drawText();}
function loadFile(file){
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{if(state.charURL) URL.revokeObjectURL(state.charURL);state.charURL=url;state.sourceImg=img;state.charImg=img;state.scale=1.35;state.x=-210;state.y=18;state.flip=false;syncControls();draw();setStatus('画像を読み込みました。次に「女の子だけ自動切り抜き」を押してください。');};
  img.src=url;
}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files?.[0]; if(f) loadFile(f);});
document.getElementById('removeBg').addEventListener('click',async()=>{
  const file=document.getElementById('file').files?.[0];
  if(!file){setStatus('先に配信スクショを選んでください。');return;}
  const btn=document.getElementById('removeBg'); btn.disabled=true; btn.textContent='AIを準備中…';
  try{
    setStatus('背景透過AIを読み込み中です。初回は少し待つことがあります…');
    const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
    btn.textContent='背景を切り抜き中…';
    const blob=await mod.removeBackground(file,{model:'small',output:{format:'image/png',quality:1},progress:(key,current,total)=>{if(total) setStatus(`自動切り抜き中… ${Math.round(current/total*100)}% (${key})`);}});
    const rawUrl=URL.createObjectURL(blob), rawImg=new Image();
    rawImg.onload=async()=>{
      setStatus('半透明のゴミを掃除しています…');
      state.charImg=await cleanCutoutToImage(rawImg,170);
      state.scale=1.35; state.x=-210; state.y=18; syncControls(); draw();
      setStatus('✨ 背景透過できました！ ゴミ残りを減らした版で表示しています。');
      URL.revokeObjectURL(rawUrl);
      btn.disabled=false; btn.textContent='✂️ 女の子だけ自動切り抜き';
    };
    rawImg.src=rawUrl;
  }catch(err){
    console.error(err);
    setStatus('自動切り抜きの読込に失敗しました。「そのまま使う」でも画像作成はできます。');
    btn.disabled=false; btn.textContent='✂️ 女の子だけ自動切り抜き';
  }
});
document.getElementById('useOriginal').addEventListener('click',()=>{if(!state.sourceImg){setStatus('先に画像を選んでください。');return;} state.charImg=state.sourceImg; draw(); setStatus('元画像をそのまま使用しています。');});
document.getElementById('randomAll').addEventListener('click',()=>{state.bgIndex=rand(palettes.length); state.decoIndex=rand(8); chooseMessage(); randomizePosition(); draw(); setStatus('🎲 全部ランダムにしました。今度はもっとゴチャゴチャめです。');});
document.getElementById('randomMsg').addEventListener('click',()=>{chooseMessage();draw();});
document.getElementById('randomBg').addEventListener('click',()=>{state.bgIndex=rand(palettes.length);draw();});
document.getElementById('randomDeco').addEventListener('click',()=>{state.decoIndex=rand(8);draw();});
document.getElementById('tone').addEventListener('change',()=>{chooseMessage();draw();});
function randomizePosition(){const left=Math.random()<.55; state.x=left?(-250-rand(80)):(245+rand(80)); state.y=-10+rand(55); state.scale=1.15+Math.random()*.42; state.flip=Math.random()<.28; syncControls();}
document.getElementById('randomPos').addEventListener('click',()=>{randomizePosition();draw();});
document.getElementById('flip').addEventListener('click',()=>{state.flip=!state.flip;draw();});
function syncControls(){document.getElementById('x').value=Math.round(state.x);document.getElementById('y').value=Math.round(state.y);document.getElementById('scale').value=Math.round(state.scale*100);document.getElementById('xo').value=Math.round(state.x);document.getElementById('yo').value=Math.round(state.y);document.getElementById('so').value=Math.round(state.scale*100)+'%';}
['x','y','scale'].forEach(id=>{document.getElementById(id).addEventListener('input',e=>{if(id==='scale') state.scale=+e.target.value/100; else state[id]=+e.target.value; syncControls(); draw();});});
function canvasPoint(ev){const r=cv.getBoundingClientRect();const touch=ev.touches?.[0]||ev.changedTouches?.[0];const clientX=touch?touch.clientX:ev.clientX, clientY=touch?touch.clientY:ev.clientY;return {x:(clientX-r.left)*W/r.width,y:(clientY-r.top)*H/r.height};}
function startDrag(ev){if(!state.charImg) return; state.drag=true; const p=canvasPoint(ev); state.lastX=p.x; state.lastY=p.y; ev.preventDefault();}
function moveDrag(ev){if(!state.drag) return; const p=canvasPoint(ev); state.x+=p.x-state.lastX; state.y+=p.y-state.lastY; state.lastX=p.x; state.lastY=p.y; syncControls(); draw(); ev.preventDefault();}
function endDrag(){state.drag=false}
cv.addEventListener('mousedown',startDrag); window.addEventListener('mousemove',moveDrag); window.addEventListener('mouseup',endDrag);
cv.addEventListener('touchstart',startDrag,{passive:false}); cv.addEventListener('touchmove',moveDrag,{passive:false}); cv.addEventListener('touchend',endDrag);
document.getElementById('save').addEventListener('click',()=>{draw(); const a=document.createElement('a'); const d=new Date(), pad=n=>String(n).padStart(2,'0'); a.download=`ohayou_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.png`; a.href=cv.toDataURL('image/png'); a.click(); setStatus('PNGを書き出しました 🌞');});
document.getElementById('reset').addEventListener('click',()=>{state.bgIndex=0; state.decoIndex=0; state.msg="今日もいい日になりますように♡"; state.x=-210; state.y=18; state.scale=1.35; state.flip=false; syncControls(); draw(); setStatus('デザインを初期状態に戻しました。');});
state.msg="今日もいい日になりますように♡"; draw();
</script>
</body>
</html>
